<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soc_brain AG-UI Dashboard</title>
<link rel="stylesheet" href="/copilotkit-styles.css">
<style>
  :root { --bg: #0f1117; --surface: #1a1d27; --border: #2a2d3a; --text: #e1e4ed; --accent: #6c8cff; --accent2: #4ade80; --warn: #f59e0b; --danger: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .ag-ui-dashboard { min-height: 100vh; display: flex; flex-direction: column; }
  .ag-ui-dashboard h1 { font-size: 1.2rem; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .ag-ui-dashboard h1 span { color: var(--accent); }
  .main-layout { display: flex; flex: 1; gap: 0; flex-wrap: wrap; }
  .task-sidebar { width: 320px; min-width: 280px; padding: 12px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; max-height: calc(100vh - 52px); }
  .chat-area { flex: 1; min-width: 300px; display: flex; flex-direction: column; padding: 12px; overflow-y: auto; }
  .epoch-display { font-size: 0.8rem; color: var(--accent); padding: 4px 16px 12px; }
  .task-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
  .task-card:hover { border-color: var(--accent); }
  .task-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .task-card h3 { font-size: 0.95rem; margin-bottom: 4px; }
  .task-card div { font-size: 0.8rem; color: #9ca3af; }
  .task-detail { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 8px; }
  .task-detail h3 { font-size: 0.95rem; margin-bottom: 8px; }
  .task-detail ol { padding-left: 20px; font-size: 0.8rem; }
  .task-detail li { margin-bottom: 4px; color: #9ca3af; }
  .messages { flex: 1; overflow-y: auto; margin-bottom: 8px; }
  .message { padding: 8px 12px; margin-bottom: 4px; border-radius: 8px; max-width: 90%; }
  .message.user { background: var(--accent); color: #fff; margin-left: auto; }
  .message.assistant { background: var(--surface); border: 1px solid var(--border); }
  .chat-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .chat-input-row input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.9rem; }
  .chat-input-row button, .command-buttons button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: background 0.15s, border-color 0.15s; }
  .chat-input-row button:hover, .command-buttons button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .command-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .human-gate-card { background: #1c1208; border: 1px solid var(--warn); border-radius: 8px; padding: 12px; margin-top: 8px; }
  .human-gate-card h3 { color: var(--warn); margin-bottom: 6px; }
  .gate-actions { display: flex; gap: 8px; margin-top: 8px; }
  .gate-actions button { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
  .gate-actions button:first-child { background: var(--accent2); color: #000; }
  .gate-actions button:last-child { background: var(--danger); color: #fff; }
  .gate-status { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 8px; }
  @media (max-width: 768px) { .main-layout { flex-direction: column; } .task-sidebar { width: 100%; max-height: none; border-right: none; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body>
<div id="root">loading copilotkit dashboard…</div>
<script type="module" src="/ui.js"></script>
</body>
</html>
